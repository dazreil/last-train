# The Xcode project is generated from this file, never hand-edited.
#
# `xcodegen generate` writes LastTrain.xcodeproj, which is gitignored. That keeps the
# project consistent with everything else here — the station list, the geo table and
# the compass are all generated too, and the rule this project has held since the
# start is that identifiers are resolved, not typed. A .pbxproj is several hundred
# lines of hand-written UUIDs, which is exactly that failure waiting to happen.
#
# Adding the widget extension (IOS.md §9 step 6, the reason for going native at all)
# was a few lines here rather than surgery on generated XML, which is the whole argument
# for this file made good.

name: LastTrain

# The App Group is what lets the widget read which station the app was last on. Named
# once, so the two entitlements below cannot drift apart -- and if they ever did, the
# symptom would be a widget that silently sees an empty defaults domain rather than an
# error, which is the worst kind.
appGroup: &appGroup group.com.dazreil.lasttrain

options:
  bundleIdPrefix: com.dazreil
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  LastTrainCore:
    # The domain logic, already complete and tested: service day, compass direction,
    # board arrangement, nearest station, bundled stations.
    path: .

targets:
  LastTrain:
    type: application
    platform: iOS
    sources:
      - path: App/LastTrain
      # Theme, station-name shortening and the shared selection. Compiled into both
      # targets rather than pushed down into LastTrainCore, which imports Foundation
      # and nothing else and is meant to keep it that way.
      - path: App/Shared
    dependencies:
      - package: LastTrainCore
        product: LastTrainCore
      # Embeds the extension in the app, which is how a widget ships.
      - target: LastTrainWidget
    entitlements:
      path: App/LastTrain/LastTrain.entitlements
      properties:
        com.apple.security.application-groups: [*appGroup]
    info:
      path: App/LastTrain/Info.plist
      properties:
        CFBundleDisplayName: Last Train
        # Where a widget tap lands. `BoardModel.open` refuses anything it cannot
        # resolve to a real station and a real compass point.
        CFBundleURLTypes:
          - CFBundleURLName: com.dazreil.lasttrain.board
            CFBundleURLSchemes: [lasttrain]
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Portrait only. The governing scene is one hand, outdoors, after dark — there
        # is no landscape reading of a departure board worth supporting.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # DESIGN.md is a dark system. The board is flat colour blocks on near-black;
        # a light rendering of it would be a different design, not a variant.
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        # The nearest-station button, and nothing else. Asked for when-in-use only, and
        # only when the button is pressed -- the app never watches your position, since
        # a departure board is read standing still.
        NSLocationWhenInUseUsageDescription:
          Last Train uses your location once, when you tap the nearest-station button,
          to fill in the station you are standing at.
        # Which API to talk to. Never RTT directly — the token stays server-side, so
        # this is always our own deployment. See IOS.md §3 and §5.
        BoardAPIBaseURL: $(BOARD_API_BASE_URL)
        NSAppTransportSecurity:
          # Debug points at a dev server on http://localhost. The exception is scoped
          # to localhost alone, so it cannot weaken anything in a shipped build.
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dazreil.lasttrain
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # iPhone only.
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        # `npm run dev` on the machine running the simulator.
        Debug:
          BOARD_API_BASE_URL: http:/$()/localhost:3000
        # The deployment. If this starts returning a Vercel login page, Deployment
        # Protection has come back on — see STATUS.md.
        Release:
          BOARD_API_BASE_URL: https:/$()/last-train-dazreils-projects.vercel.app

  # IOS.md §7: "if one native feature ships, it is that one".
  LastTrainWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: App/Widget
      - path: App/Shared
    dependencies:
      - package: LastTrainCore
        product: LastTrainCore
    entitlements:
      path: App/Widget/LastTrainWidget.entitlements
      properties:
        com.apple.security.application-groups: [*appGroup]
    info:
      path: App/Widget/Info.plist
      properties:
        CFBundleDisplayName: Last Train
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # `Bundle.main` inside an extension is the *extension's* bundle, so this has to
        # be set here as well as on the app. AppConfig traps a missing one rather than
        # quietly falling back to a URL that would be wrong in one configuration.
        BoardAPIBaseURL: $(BOARD_API_BASE_URL)
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dazreil.lasttrain.widget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          BOARD_API_BASE_URL: http:/$()/localhost:3000
        Release:
          BOARD_API_BASE_URL: https:/$()/last-train-dazreils-projects.vercel.app
